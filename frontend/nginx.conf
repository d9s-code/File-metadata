server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 'unsafe-inline' for styles only: React style={{...}} props and
    # recharts render inline style attributes. Scripts stay 'self'-only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite's hashed build output never changes under the same name. Only
    # `expires` here, no add_header, so the server-level headers above
    # still apply (a location-level add_header would replace them all).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing (react-router-dom): fall back to index.html
    # for any path that isn't a real file, instead of nginx's 404.
    # index.html itself must always be revalidated so a deploy is picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
