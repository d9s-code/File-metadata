# Copy this file to secret.yaml (same folder) and fill it in. secret.yaml is
# kept out of git (.gitignore) — never commit the real values.
#
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#
# Values go between the quotes as plain text; Kubernetes encodes them itself.
# After changing one: sudo k3s kubectl apply -k deploy/k8s, then
#   sudo k3s kubectl -n prs rollout restart deploy/backend deploy/backup
apiVersion: v1
kind: Secret
metadata:
  name: prs-secrets
type: Opaque
stringData:
  # CHANGE_ME — the database: user, password and database name (as on your
  # Postgres today). Keep the host "postgres": that's the name k3s gives your
  # database — postgres-on-docker.yaml points it at the Postgres in Docker on
  # this server (or optional/postgres.yaml, once Postgres runs inside k3s).
  DATABASE_URL: "postgresql+psycopg2://CHANGE_ME_USER:CHANGE_ME_PASSWORD@postgres:5432/CHANGE_ME_DB"

  # CHANGE_ME — signs logins. Generate one with:  openssl rand -hex 32
  # (the app refuses to start with this placeholder). Changing it logs everyone out.
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_32"

  # CHANGE_ME — the first admin's password (ADMIN_USERNAME is in config.yaml).
  # Only used when that account is first made; change it in the app afterwards.
  # At least 12 characters; the app refuses CHANGE_ME.
  ADMIN_PASSWORD: "CHANGE_ME"

  # Optional — where each backup is test-restored. Left out: the database's
  # name + "_verify" on the same server, which must exist (README → Backups).
  # BACKUP_VERIFY_DATABASE_URL: "postgresql+psycopg2://USER:PASSWORD@HOST:5432/DB_verify"

  # Optional — only if your language model server wants a key.
  # LLM_API_KEY: "CHANGE_ME"

  # Optional — the Outline API token (Outline → Settings → API).
  # OUTLINE_API_TOKEN: "ol_api_CHANGE_ME"

  # Only with optional/postgres.yaml (Postgres inside k3s): the database it
  # creates on first start. Use the same user, password and name in DATABASE_URL.
  # POSTGRES_USER: "rf_app"
  # POSTGRES_PASSWORD: "CHANGE_ME"
  # POSTGRES_DB: "rf_emitter_db"
