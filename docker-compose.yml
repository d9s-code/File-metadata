# Settings the web app and the backup scheduler share — both talk to the same
# database and write to the same backup volume.
x-backend-env: &backend-env
  # TODO: replace with the role/database you create on the existing
  # Postgres 15 instance, and its container/service name as the host
  # (must be reachable on whatever network you join below).
  DATABASE_URL: postgresql+psycopg2://CHANGE_ME_USER:CHANGE_ME_PASSWORD@CHANGE_ME_POSTGRES_HOST:5432/CHANGE_ME_DB
  # Real secret — generate with `openssl rand -hex 32`, don't ship the
  # placeholder. Since this file is hardcoded (not .env-driven), be
  # careful not to commit the real value if this repo is tracked in git.
  JWT_SECRET: CHANGE_ME_generate_with_openssl_rand_hex_32
  CORS_ORIGINS: '["https://prs.app"]'
  # true: Traefik terminates TLS in front of this with your AD-issued
  # cert, so the browser only ever sees HTTPS.
  COOKIE_SECURE: "true"
  BACKUP_DIR: /backups
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: CHANGE_ME
  # Optional: verification restores each backup into a scratch database — by
  # default the live database's name + `_verify` on the same server, which
  # must be created once (see README → Backups). Or point this elsewhere:
  # BACKUP_VERIFY_DATABASE_URL: postgresql+psycopg2://USER:PASSWORD@HOST:5432/DB_verify
  # Optional: a second place every backup is copied to (mount it below on the
  # backup service too), e.g. a share on another machine.
  # BACKUP_COPY_DIR: /backups-copy
  # Automatic backups: a weekday (or "daily") and a time, UTC.
  BACKUP_SCHEDULE_DAY: sun
  BACKUP_SCHEDULE_TIME: "03:00"
  # Between them, a backup is due a week after the last one at this many
  # changes, half a week at twice as many, and so on — admins are warned then.
  BACKUP_CHANGES_PER_WEEK: "50"
  # Optional: a language model behind an OpenAI-compatible API (e.g. vLLM) to
  # explain ambiguity findings. Unset, the AI buttons don't show. The address
  # goes up to and including /v1; LLM_MODEL only if the server serves several.
  # LLM_BASE_URL: http://vllm-host:8000/v1
  # LLM_MODEL: your-model-name
  # LLM_API_KEY: only-if-your-server-wants-one
  # Optional: an Outline wiki whose pages the model may be given as background;
  # the token's Outline account decides what can be read.
  # OUTLINE_URL: https://outline.app
  # OUTLINE_API_TOKEN: ol_api_...
  # A page and everything under it (its address), or a whole collection:
  # OUTLINE_ROOT: https://outline.app/doc/prs-AbC123xyz
  # OUTLINE_COLLECTION: Group 1
  # The relevant sections, up to about this many tokens, go with each question:
  # OUTLINE_CONTEXT_TOKENS: "6000"

services:
  backend:
    build: ./backend
    # Fixed, predictable tag so the offline build/load scripts (see
    # scripts/offline/) can `docker save`/`docker load` this exact image
    # by name instead of guessing compose's auto-generated project tag.
    image: rf-emitter-backend:latest
    restart: unless-stopped
    # TODO: point this at your existing Postgres 15 container once you've
    # added it below (copied from one of your other stacks), e.g.:
    #   depends_on:
    #     my-postgres:
    #       condition: service_healthy
    environment: *backend-env
    volumes:
      - backup_data:/backups
    networks:
      - web
      # TODO: also join whatever network your existing Postgres container
      # is on, if it's different from `web`.
    # create_admin.py no-ops if the user already exists, so this is safe
    # to run on every container start/restart — there is no register form,
    # so this is the only way to get a first user into a fresh database.
    # It refuses a CHANGE_ME or short password when creating that user.
    # --proxy-headers: the login rate limiter keys on the client IP, which
    # only Traefik's X-Forwarded-For carries. Trusting it from any source is
    # safe only because this service publishes no ports of its own.
    command: >
      sh -c "alembic upgrade head && python scripts/create_admin.py \"$$ADMIN_USERNAME\" \"$$ADMIN_PASSWORD\" && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    labels:
      traefik.enable: "true"
      # More specific than the frontend's bare Host() rule below, so
      # Traefik should already prefer this for /api/* — priority is set
      # explicitly anyway since routing-by-rule-length can surprise you.
      traefik.http.routers.rf-emitter-backend.rule: Host(`prs.app`) && PathPrefix(`/api`)
      traefik.http.routers.rf-emitter-backend.entrypoints: websecure
      traefik.http.routers.rf-emitter-backend.tls: "true"
      traefik.http.routers.rf-emitter-backend.priority: "10"
      # FastAPI's routes aren't mounted under /api, so strip it before
      # Traefik forwards the request.
      traefik.http.routers.rf-emitter-backend.middlewares: rf-emitter-strip-api,rf-emitter-body-limit
      traefik.http.middlewares.rf-emitter-strip-api.stripprefix.prefixes: /api
      # Rejects oversized bodies before they reach the backend; the backend's
      # own MAX_UPLOAD_BYTES (10 MB) is the per-file limit behind this.
      traefik.http.middlewares.rf-emitter-body-limit.buffering.maxRequestBodyBytes: "20971520"
      traefik.http.services.rf-emitter-backend.loadbalancer.server.port: "8000"
    # /health answers 503 when the database is unreachable.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Weekly backups (BACKUP_SCHEDULE_DAY), apart from the web app so they happen
  # whether or not it's up: backup → verify (restore into the scratch database)
  # → prune old ones. Every day it also purges expired Recently Deleted items.
  # Takes a backup straight away if the latest is over a week old. Status shows
  # on Admin → Backups and the dashboard.
  backup:
    image: rf-emitter-backend:latest
    restart: unless-stopped
    depends_on:
      backend:
        # Migrations run in the backend's start command.
        condition: service_healthy
    environment: *backend-env
    volumes:
      - backup_data:/backups
      # A second copy on another machine: uncomment this, BACKUP_COPY_DIR above,
      # and the backup_copy volume at the bottom of this file.
      # - backup_copy:/backups-copy
    networks:
      - web
    command: python scripts/backup_scheduler.py

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes this into the built JS at image-build time — same
        # origin/path as the Traefik rule above, so the browser's fetches
        # to /api/* get routed to the backend without needing CORS at all.
        VITE_API_BASE_URL: https://prs.app/api
    image: rf-emitter-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    labels:
      traefik.enable: "true"
      traefik.http.routers.rf-emitter-frontend.rule: Host(`prs.app`)
      traefik.http.routers.rf-emitter-frontend.entrypoints: websecure
      traefik.http.routers.rf-emitter-frontend.tls: "true"
      traefik.http.routers.rf-emitter-frontend.priority: "1"
      traefik.http.services.rf-emitter-frontend.loadbalancer.server.port: "80"

networks:
  web:
    external: true

volumes:
  # Only backups live in a compose-managed volume now — the database
  # itself is the existing Postgres 15 instance, managed elsewhere.
  backup_data:
  # A share on another computer, mounted straight into the backup container —
  # nothing to set up on this host. A Windows share (SMB):
  # backup_copy:
  #   driver: local
  #   driver_opts:
  #     type: cifs
  #     device: //OTHER-PC/rf-backups
  #     o: "addr=OTHER-PC,username=CHANGE_ME,password=CHANGE_ME,uid=10001,gid=10001,file_mode=0640,dir_mode=0750"
  # or a Linux server's NFS export:
  #     type: nfs
  #     device: ":/srv/rf-backups"
  #     o: "addr=OTHER-SERVER,rw,nfsvers=4"
